<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cipher ⁷³ — Linear Algebra &amp; Analytical Geometry</title>
<style>
:root{
  --bg:#121212;
  --surface:#1a1a1a;
  --surface2:#1e1e1e;
  --surface3:#242424;
  --border:#2c2c2c;
  --cyan:#00ffcc;
  --green:#00b38f;
  --text:#eaeaea;
  --text-dim:#9a9a9a;
  --red:#ff5c5c;
  --amber:#ffb020;
  --font-en:'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-ar:'Tahoma','Segoe UI',sans-serif;
  --radius-s:6px;
  --radius-m:10px;
  --maxw:1180px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-en);
  line-height:1.55;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{font-family:var(--font-ar);}
sup{font-size:0.68em;}
sub{font-size:0.68em;}
::selection{background:var(--cyan);color:#00110d;}

/* ---------- Splash ---------- */
#splash{
  position:fixed;inset:0;background:radial-gradient(circle at 50% 30%, #182722 0%, #0d0d0d 70%);
  display:flex;align-items:center;justify-content:center;z-index:999;
  animation:fadeIn .4s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.splash-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:48px 40px;max-width:420px;width:90%;text-align:center;
  box-shadow:0 0 60px rgba(0,255,204,0.08);
}
.splash-logo{font-size:2rem;font-weight:800;letter-spacing:1px;margin-bottom:6px;}
.splash-logo span{color:var(--cyan);}
.splash-sub{color:var(--text-dim);font-size:.85rem;margin-bottom:32px;letter-spacing:.5px;}
.lang-choice{display:flex;gap:14px;flex-direction:column;}
.lang-btn{
  padding:16px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface3);color:var(--text);font-size:1.05rem;cursor:pointer;
  transition:.2s;font-weight:600;
}
.lang-btn:hover{border-color:var(--cyan);color:var(--cyan);background:#1c2b27;}

/* ---------- Header ---------- */
header{
  position:sticky;top:0;z-index:50;background:rgba(18,18,18,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.header-inner{
  max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;white-space:nowrap;}
.brand-mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--green));
  display:flex;align-items:center;justify-content:center;color:#08130f;font-weight:900;font-size:1rem;flex-shrink:0;}
.brand span{color:var(--cyan);}
nav#tabNav{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:center;}
.tab-btn{
  background:transparent;border:1px solid transparent;color:var(--text-dim);
  padding:9px 14px;border-radius:var(--radius-s);cursor:pointer;font-size:.85rem;font-weight:600;
  transition:.15s;white-space:nowrap;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--surface3);color:var(--cyan);border-color:var(--border);}
#langToggle{
  background:var(--surface3);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:var(--radius-s);cursor:pointer;font-weight:700;font-size:.85rem;
  flex-shrink:0;
}
#langToggle:hover{border-color:var(--cyan);}

/* ---------- Main layout ---------- */
main{max-width:var(--maxw);margin:0 auto;padding:28px 20px 80px;}
.section{display:none;animation:fadeIn .25s ease;}
.section.active{display:block;}
.section-title{font-size:1.5rem;font-weight:800;margin:0 0 6px;}
.section-desc{color:var(--text-dim);font-size:.92rem;margin:0 0 26px;max-width:640px;}

/* ---------- Math RTL fix ----------
   ALL mathematical formulas/equations/variables/numbers are wrapped
   in this class with a forced LTR direction so operators, exponents,
   coordinates and equation order never scramble inside RTL (Arabic)
   layout context. */
.math-ltr{
  direction:ltr;
  text-align:left;
  unicode-bidi:isolate;
  display:block;
  font-family:'Consolas','Courier New',monospace;
}
span.math-ltr{display:inline-block;}
html[dir="rtl"] .math-ltr{text-align:left;}

/* ---------- Formula cheat sheet ---------- */
.formula-group{margin-bottom:30px;}
.formula-group h3{
  font-size:1rem;color:var(--cyan);border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px;
  letter-spacing:.3px;
}
.formula-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.formula-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:16px 18px;transition:.2s;
}
.formula-card:hover{border-color:var(--green);}
.formula-name{font-size:.82rem;color:var(--text-dim);margin-bottom:8px;font-weight:600;}
.formula-eq.math-ltr{
  font-size:1.05rem;color:var(--cyan);font-weight:700;background:#0f1614;border-radius:var(--radius-s);
  padding:10px 12px;margin-bottom:8px;overflow-x:auto;
}
.formula-note{font-size:.8rem;color:var(--text-dim);}

/* ---------- Sheet Exercises (تمارين الشيتات) ---------- */
.sheet-list{display:flex;flex-direction:column;gap:16px;}
.sheet-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;
}
.sheet-src{font-size:.7rem;color:var(--green);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.sheet-prob{font-size:.95rem;font-weight:600;margin-bottom:10px;}
.sheet-prob-math.math-ltr{
  color:var(--cyan);font-weight:700;background:#0f1614;border:1px dashed var(--border);
  border-radius:var(--radius-s);padding:12px 14px;margin-bottom:14px;font-size:1rem;
}
.sheet-sol{
  display:none;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);
}
.sheet-sol.open{display:flex;}
.sheet-sol-line{
  background:var(--surface3);border-left:3px solid var(--cyan);border-radius:var(--radius-s);
  padding:12px 14px;font-size:.9rem;
}
html[dir="rtl"] .sheet-sol-line{border-left:none;border-right:3px solid var(--cyan);}
.sol-lbl{font-size:.85rem;color:var(--text-dim);margin-bottom:6px;display:block;}
.sol-lbl:empty{display:none;}

/* ---------- Exercises ---------- */
.ex-list{display:flex;flex-direction:column;gap:14px;}
.ex-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);overflow:hidden;
}
.ex-head{
  padding:18px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.ex-head:hover{background:var(--surface3);}
.ex-tag{font-size:.7rem;color:var(--green);font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
.ex-title{font-size:1rem;font-weight:700;margin-top:4px;}
.ex-body{padding:0 20px 20px;display:none;}
.ex-body.open{display:block;}
.ex-problem{
  background:#0f1614;border:1px dashed var(--border);border-radius:var(--radius-s);
  padding:14px 16px;margin-bottom:16px;color:var(--cyan);font-weight:600;
}
.ex-problem-math.math-ltr{margin-top:8px;font-weight:700;}
.ex-steps{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
.ex-step{
  background:var(--surface3);border-left:3px solid var(--green);border-radius:var(--radius-s);
  padding:12px 14px;font-size:.92rem;animation:slideIn .25s ease;
}
.ex-step .step-lbl{display:block;margin-bottom:6px;}
.ex-step .step-lbl:empty{display:none;}
html[dir="rtl"] .ex-step{border-left:none;border-right:3px solid var(--green);}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ex-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.btn{
  background:linear-gradient(135deg,var(--green),var(--cyan));color:#06130f;border:none;
  padding:10px 18px;border-radius:var(--radius-s);font-weight:700;cursor:pointer;font-size:.85rem;
  transition:.15s;
}
.btn:hover{filter:brightness(1.1);}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:none;}
.btn-outline{
  background:transparent;border:1px solid var(--border);color:var(--text);
}
.btn-outline:hover{border-color:var(--cyan);color:var(--cyan);}
.step-counter{font-size:.78rem;color:var(--text-dim);}

/* ---------- Bug Hunt ---------- */
.bug-list{display:flex;flex-direction:column;gap:24px;}
.bug-card{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);padding:20px;
}
.bug-card h4{margin:0 0 4px;font-size:.98rem;}
.bug-title-math.math-ltr{color:var(--text-dim);font-size:.85rem;margin-bottom:10px;}
.bug-hint{color:var(--text-dim);font-size:.82rem;margin-bottom:14px;}
.bug-line{
  padding:12px 14px;border-radius:var(--radius-s);margin-bottom:8px;background:var(--surface3);
  cursor:pointer;font-size:.92rem;border:1px solid var(--border);transition:.15s;
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
}
.bug-line .line-lbl{color:var(--text-dim);font-size:.78rem;font-weight:700;flex-shrink:0;}
.bug-line .math-ltr{flex:1;min-width:180px;}
.bug-line:hover{border-color:var(--cyan);}
.bug-line.correct{background:#0f2b22;border-color:var(--green);}
.bug-line.correct .math-ltr,.bug-line.correct .line-lbl{color:var(--green);}
.bug-line.wrong{background:#2b1414;border-color:var(--red);}
.bug-line.wrong .math-ltr,.bug-line.wrong .line-lbl{color:var(--red);}
.bug-explain{
  margin-top:12px;padding:14px;border-radius:var(--radius-s);background:#0f1614;
  border:1px solid var(--green);font-size:.86rem;display:none;
}
.bug-explain.show{display:block;}
.bug-status{font-size:.8rem;font-weight:700;margin-top:10px;}

/* ---------- Exam Center ---------- */
.exam-intro{
  background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);
  padding:24px;margin-bottom:20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:center;
}
.exam-stats{display:flex;gap:26px;flex-wrap:wrap;}
.stat-num{font-size:1.6rem;font-weight:800;color:var(--cyan);}
.stat-label{font-size:.75rem;color:var(--text-dim);}
.exam-layout{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start;}
.quiz-panel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);padding:22px;}
.q-progress{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;}
.q-progress-bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden;margin-bottom:18px;}
.q-progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));transition:.3s;}
.q-text{font-size:1.05rem;font-weight:700;margin-bottom:18px;}
.q-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.q-opt{
  padding:13px 16px;border-radius:var(--radius-s);border:1px solid var(--border);background:var(--surface3);
  cursor:pointer;font-size:.92rem;transition:.15s;
}
.q-opt .math-ltr{display:block;background:none;padding:0;}
.q-opt:hover{border-color:var(--cyan);}
.q-opt.selected{border-color:var(--cyan);background:#122522;}
.q-opt.correct{background:#0f2b22;border-color:var(--green);}
.q-opt.correct .math-ltr{color:var(--green);}
.q-opt.incorrect{background:#2b1414;border-color:var(--red);}
.q-opt.incorrect .math-ltr{color:var(--red);}
.scratchpad-box textarea{
  width:100%;min-height:220px;background:var(--surface3);border:1px solid var(--border);
  border-radius:var(--radius-s);color:var(--text);padding:12px;font-family:monospace;font-size:.85rem;resize:vertical;
}
.scratchpad-box h4{font-size:.85rem;color:var(--text-dim);margin:0 0 10px;font-weight:700;letter-spacing:.3px;}
.score-screen{text-align:center;padding:50px 20px;}
.score-num{font-size:3.2rem;font-weight:900;color:var(--cyan);}
.score-sub{color:var(--text-dim);margin-top:6px;}

/* ---------- Glossary ---------- */
.search-wrap{margin-bottom:22px;}
#glossarySearch{
  width:100%;padding:14px 18px;border-radius:var(--radius-s);border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:.95rem;
}
#glossarySearch:focus{outline:none;border-color:var(--cyan);}
.glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.g-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-m);padding:16px 18px;}
.g-term-en{font-weight:800;color:var(--cyan);font-size:.98rem;}
.g-term-ar{font-weight:800;color:var(--green);font-size:.98rem;margin-top:2px;}
.g-def{font-size:.82rem;color:var(--text-dim);margin-top:8px;}
.no-results{color:var(--text-dim);text-align:center;padding:40px;grid-column:1/-1;}

footer{text-align:center;padding:30px 20px;color:var(--text-dim);font-size:.78rem;border-top:1px solid var(--border);}

/* ---------- Mobile ---------- */
@media (max-width:768px){
  .header-inner{flex-direction:column;align-items:stretch;}
  nav#tabNav{order:3;width:100%;justify-content:flex-start;overflow-x:auto;padding-bottom:4px;}
  .brand{justify-content:space-between;width:100%;}
  #langToggle{width:100%;}
  .exam-layout{grid-template-columns:1fr;}
  .exam-intro{flex-direction:column;align-items:flex-start;}
  .formula-grid,.glossary-grid{grid-template-columns:1fr;}
  main{padding:20px 14px 60px;}
  .splash-card{padding:32px 22px;}
  .bug-line{flex-direction:column;align-items:flex-start;gap:4px;}
  .bug-line .math-ltr{width:100%;min-width:0;}
  .ex-controls{flex-direction:column;align-items:stretch;}
  .ex-controls .btn,.ex-controls .btn-outline{width:100%;}
  .math-ltr{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .sheet-card,.ex-card,.bug-card,.formula-card,.g-card{width:100%;}
}
</style>
</head>

/* ============================================================
   APP STATE
   ============================================================ */
let examState = { pool:[], current:0, score:0, selected:null, answered:false, finished:false };

/* ============================================================
   INITIALIZATION
   ============================================================ */
function t(key){ return UI[LANG][key] || key; }

function setLanguage(lang){
  LANG = lang;
  document.getElementById('htmlRoot').setAttribute('lang', lang);
  document.getElementById('htmlRoot').setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  document.querySelectorAll('[data-t]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-t'));
  });
  document.getElementById('langToggle').textContent = t('langToggleLabel');
  document.getElementById('glossarySearch').placeholder = t('searchPlaceholder');
  renderNav();
  renderFormulas();
  renderSheets();
  renderExercises();
  renderBugs();
  renderGlossary();
  renderExamIntro();
}

function renderNav(){
  const nav = document.getElementById('tabNav');
  nav.innerHTML = '';
  TABS.forEach((tab, i)=>{
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i===0 && !document.querySelector('.tab-btn.active') ? ' active' : '');
    if(document.querySelector('.section.active')){
      btn.className = 'tab-btn' + (document.getElementById('sec-'+tab.id).classList.contains('active') ? ' active' : '');
    } else if(i===0){
      btn.className = 'tab-btn active';
    }
    btn.textContent = t(tab.key);
    btn.onclick = ()=> switchTab(tab.id);
    nav.appendChild(btn);
  });
  if(!document.querySelector('.section.active')){
    switchTab(TABS[0].id);
  }
}

function switchTab(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active', TABS[i].id === id);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ============================================================
   FORMULA CHEAT SHEET RENDER
   ============================================================ */
function renderFormulas(){
  const c = document.getElementById('formulaContainer');
  c.innerHTML = '';
  FORMULAS.forEach(group=>{
    const g = document.createElement('div');
    g.className = 'formula-group';
    const h = document.createElement('h3');
    h.textContent = LANG === 'ar' ? group.group_ar : group.group_en;
    g.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'formula-grid';
    group.items.forEach(item=>{
      const card = document.createElement('div');
      card.className = 'formula-card';
      card.innerHTML = `
        <div class="formula-name">${LANG==='ar' ? item.n_ar : item.n_en}</div>
        <div class="formula-eq math-ltr" dir="ltr">${item.eq}</div>
        <div class="formula-note">${LANG==='ar' ? item.note_ar : item.note_en}</div>
      `;
      grid.appendChild(card);
    });
    g.appendChild(grid);
    c.appendChild(g);
  });
}

/* ============================================================
   SHEET EXERCISES RENDER (Show Solution toggle)
   ============================================================ */
let sheetStates = {};
function renderSheets(){
  const c = document.getElementById('sheetContainer');
  c.innerHTML = '';
  SHEET_EXERCISES.forEach((sh, idx)=>{
    if(!(idx in sheetStates)) sheetStates[idx] = false;
    const card = document.createElement('div');
    card.className = 'sheet-card';

    const src = document.createElement('div');
    src.className = 'sheet-src';
    src.innerHTML = LANG==='ar' ? sh.src_ar : sh.src_en;
    card.appendChild(src);

    const prob = document.createElement('div');
    prob.className = 'sheet-prob';
    prob.innerHTML = LANG==='ar' ? sh.prob_ar : sh.prob_en;
    card.appendChild(prob);

    if(sh.probMath){
      const pm = document.createElement('div');
      pm.className = 'sheet-prob-math math-ltr';
      pm.setAttribute('dir','ltr');
      pm.innerHTML = sh.probMath;
      card.appendChild(pm);
    }

    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = sheetStates[idx] ? t('hideSolution') : t('showSolution');
    btn.onclick = ()=>{ sheetStates[idx] = !sheetStates[idx]; renderSheets(); };
    card.appendChild(btn);

    const solWrap = document.createElement('div');
    solWrap.className = 'sheet-sol' + (sheetStates[idx] ? ' open' : '');
    sh.sol.forEach(line=>{
      const lEl = document.createElement('div');
      lEl.className = 'sheet-sol-line';
      const lbl = LANG==='ar' ? line.lbl_ar : line.lbl_en;
      lEl.innerHTML = `
        <span class="sol-lbl">${lbl}</span>
        <span class="math-ltr" dir="ltr">${line.math}</span>
      `;
      solWrap.appendChild(lEl);
    });
    card.appendChild(solWrap);

    c.appendChild(card);
  });
}

/* ============================================================
   EXERCISES RENDER (step-by-step)
   ============================================================ */
let exerciseStates = {};
function renderExercises(){
  const c = document.getElementById('exerciseContainer');
  c.innerHTML = '';
  EXERCISES.forEach((ex, idx)=>{
    if(!(idx in exerciseStates)) exerciseStates[idx] = { revealed:0, open:false };
    const card = document.createElement('div');
    card.className = 'ex-card';
    const head = document.createElement('div');
    head.className = 'ex-head';
    head.innerHTML = `
      <div>
        <div class="ex-tag">${LANG==='ar' ? ex.tag_ar : ex.tag_en}</div>
        <div class="ex-title">${LANG==='ar' ? ex.title_ar : ex.title_en}</div>
      </div>
      <div style="font-size:1.2rem;color:var(--text-dim);">${exerciseStates[idx].open ? '&#9650;' : '&#9660;'}</div>
    `;
    head.onclick = ()=>{
      exerciseStates[idx].open = !exerciseStates[idx].open;
      renderExercises();
    };
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'ex-body' + (exerciseStates[idx].open ? ' open' : '');

    const problem = document.createElement('div');
    problem.className = 'ex-problem';
    problem.innerHTML = `<strong>${t('problemLabel')}:</strong> ${LANG==='ar' ? ex.title_ar : ex.title_en}`;
    if(ex.titleMath){
      problem.innerHTML += `<div class="ex-problem-math math-ltr" dir="ltr">${ex.titleMath}</div>`;
    }
    body.appendChild(problem);

    const stepsWrap = document.createElement('div');
    stepsWrap.className = 'ex-steps';
    const revealed = exerciseStates[idx].revealed;
    for(let i=0;i<revealed;i++){
      const step = ex.steps[i];
      const lbl = LANG==='ar' ? step.lbl_ar : step.lbl_en;
      const s = document.createElement('div');
      s.className = 'ex-step';
      s.innerHTML = `
        <span class="step-lbl">${lbl}</span>
        ${step.math ? `<span class="math-ltr" dir="ltr">${step.math}</span>` : ''}
      `;
      stepsWrap.appendChild(s);
    }
    body.appendChild(stepsWrap);

    const controls = document.createElement('div');
    controls.className = 'ex-controls';
    const total = ex.steps.length;
    const counter = document.createElement('span');
    counter.className = 'step-counter';
    counter.textContent = revealed >= total ? t('allRevealed') : `${t('stepOf')} ${revealed} ${t('of')} ${total}`;

    const nextBtn = document.createElement('button');
    nextBtn.className = 'btn';
    nextBtn.textContent = t('nextStep');
    nextBtn.disabled = revealed >= total;
    nextBtn.onclick = (e)=>{ e.stopPropagation(); exerciseStates[idx].revealed = Math.min(total, revealed+1); renderExercises(); };

    const prevBtn = document.createElement('button');
    prevBtn.className = 'btn btn-outline';
    prevBtn.textContent = t('prevStep');
    prevBtn.disabled = revealed <= 0;
    prevBtn.onclick = (e)=>{ e.stopPropagation(); exerciseStates[idx].revealed = Math.max(0, revealed-1); renderExercises(); };

    const resetBtn = document.createElement('button');
    resetBtn.className = 'btn btn-outline';
    resetBtn.textContent = t('resetEx');
    resetBtn.onclick = (e)=>{ e.stopPropagation(); exerciseStates[idx].revealed = 0; renderExercises(); };

    controls.appendChild(prevBtn);
    controls.appendChild(nextBtn);
    controls.appendChild(resetBtn);
    controls.appendChild(counter);
    body.appendChild(controls);

    card.appendChild(body);
    c.appendChild(card);
  });
}

/* ============================================================
   FIND THE BUG RENDER
   ============================================================ */
let bugStates = {};
function renderBugs(){
  const c = document.getElementById('bugContainer');
  c.innerHTML = '';
  BUGS.forEach((bug, idx)=>{
    if(!(idx in bugStates)) bugStates[idx] = { answered:false, chosenIdx:null };
    const card = document.createElement('div');
    card.className = 'bug-card';
    const title = document.createElement('h4');
    title.textContent = LANG==='ar' ? bug.title_ar : bug.title_en;
    card.appendChild(title);

    if(bug.titleMath){
      const tm = document.createElement('div');
      tm.className = 'bug-title-math math-ltr';
      tm.setAttribute('dir','ltr');
      tm.innerHTML = bug.titleMath;
      card.appendChild(tm);
    }

    const hint = document.createElement('div');
    hint.className = 'bug-hint';
    hint.textContent = LANG==='ar' ? 'اضغط على السطر الذي يحتوي على الخطأ' : 'Click the line that contains the error';
    card.appendChild(hint);

    bug.lines.forEach((line, li)=>{
      const lEl = document.createElement('div');
      lEl.className = 'bug-line';
      const lbl = LANG==='ar' ? line.lbl_ar : line.lbl_en;
      lEl.innerHTML = `
        <span class="line-lbl">${lbl}</span>
        <span class="math-ltr" dir="ltr">${line.math}</span>
      `;
      const st = bugStates[idx];
      if(st.answered){
        if(li === bug.buggy) lEl.classList.add('correct');
        else if(li === st.chosenIdx) lEl.classList.add('wrong');
      }
      lEl.onclick = ()=>{
        if(bugStates[idx].answered) return;
        bugStates[idx].answered = true;
        bugStates[idx].chosenIdx = li;
        renderBugs();
      };
      card.appendChild(lEl);
    });

    const st = bugStates[idx];
    if(st.answered){
      const status = document.createElement('div');
      status.className = 'bug-status';
      const isCorrect = st.chosenIdx === bug.buggy;
      status.style.color = isCorrect ? 'var(--green)' : 'var(--red)';
      status.textContent = isCorrect ? t('correctLine') : t('wrongLine');
      card.appendChild(status);

      const explain = document.createElement('div');
      explain.className = 'bug-explain show';
      explain.textContent = LANG==='ar' ? bug.explain_ar : bug.explain_en;
      card.appendChild(explain);

      const retry = document.createElement('button');
      retry.className = 'btn btn-outline';
      retry.style.marginTop = '12px';
      retry.textContent = t('resetEx');
      retry.onclick = ()=>{ bugStates[idx] = {answered:false, chosenIdx:null}; renderBugs(); };
      card.appendChild(retry);
    }

    c.appendChild(card);
  });
}

/* ============================================================
   GLOSSARY RENDER + SEARCH
   ============================================================ */
function renderGlossary(filter){
  const c = document.getElementById('glossaryContainer');
  c.innerHTML = '';
  const f = (filter || '').trim().toLowerCase();
  const filtered = GLOSSARY.filter(item=>{
    if(!f) return true;
    return item.en.toLowerCase().includes(f) || item.ar.includes(f) ||
           item.d_en.toLowerCase().includes(f) || item.d_ar.includes(f);
  });
  if(filtered.length === 0){
    const none = document.createElement('div');
    none.className = 'no-results';
    none.textContent = LANG==='ar' ? 'لا توجد نتائج مطابقة' : 'No matching terms found';
    c.appendChild(none);
    return;
  }
  filtered.forEach(item=>{
    const card = document.createElement('div');
    card.className = 'g-card';
    card.innerHTML = `
      <div class="g-term-en">${item.en}</div>
      <div class="g-term-ar">${item.ar}</div>
      <div class="g-def">${LANG==='ar' ? item.d_ar : item.d_en}</div>
    `;
    c.appendChild(card);
  });
}

document.getElementById('glossarySearch').addEventListener('input', (e)=>{
  renderGlossary(e.target.value);
});

/* ============================================================
   EXAM CENTER
   ============================================================ */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function renderExamIntro(){
  const c = document.getElementById('examContainer');
  c.innerHTML = `
    <div class="exam-intro">
      <div class="exam-stats">
        <div><div class="stat-num">150</div><div class="stat-label">${t('questionCount')}</div></div>
        <div><div class="stat-num">20</div><div class="stat-label">${LANG==='ar'?'لكل محاولة':'per attempt'}</div></div>
        <div><div class="stat-num">${SHEET_EXERCISES.length}</div><div class="stat-label">${t('sheetCount')}</div></div>
        <div><div class="stat-num">${EXERCISES.length}</div><div class="stat-label">${t('exerciseCount')}</div></div>
        <div><div class="stat-num">${GLOSSARY.length}</div><div class="stat-label">${t('termCount')}</div></div>
      </div>
      <button class="btn" id="startExamBtn">${t('startExam')}</button>
    </div>
    <div id="examBody"></div>
  `;
  document.getElementById('startExamBtn').onclick = startExam;
}

function startExam(){
  examState.pool = shuffleArray(QUESTIONS).slice(0, 20);
  examState.current = 0;
  examState.score = 0;
  examState.selected = null;
  examState.answered = false;
  examState.finished = false;
  renderExamBody();
}

function renderExamBody(){
  const body = document.getElementById('examBody');
  if(examState.finished){
    body.innerHTML = `
      <div class="quiz-panel score-screen">
        <div class="score-num">${examState.score} / ${examState.pool.length}</div>
        <div class="score-sub">${t('score')} — ${examState.score} ${t('correctAnswers')} ${examState.pool.length}</div>
        <button class="btn" id="retakeBtn" style="margin-top:24px;">${t('retake')}</button>
      </div>
    `;
    document.getElementById('retakeBtn').onclick = startExam;
    return;
  }

  const q = examState.pool[examState.current];
  const opts = LANG==='ar' ? q.opts_ar : q.opts_en;
  const qtext = LANG==='ar' ? q.ar : q.en;
  const progressPct = ((examState.current) / examState.pool.length) * 100;

  body.innerHTML = `
    <div class="exam-layout">
      <div class="quiz-panel">
        <div class="q-progress">${t('question')} ${examState.current+1} ${t('of')} ${examState.pool.length}</div>
        <div class="q-progress-bar"><div class="q-progress-fill" style="width:${progressPct}%"></div></div>
        <div class="q-text">${qtext}</div>
        <div class="q-opts" id="qOpts"></div>
        <div style="display:flex;gap:10px;">
          <button class="btn" id="submitBtn" disabled>${t('submit')}</button>
        </div>
      </div>
      <div class="scratchpad-box">
        <h4>${t('scratchpad')}</h4>
        <textarea id="scratchpad" placeholder="${t('scratchpadPlaceholder')}"></textarea>
      </div>
    </div>
  `;

  const optsWrap = document.getElementById('qOpts');
  opts.forEach((opt, i)=>{
    const el = document.createElement('div');
    el.className = 'q-opt';
    el.innerHTML = `<span class="math-ltr" dir="ltr">${opt}</span>`;
    el.onclick = ()=>{
      if(examState.answered) return;
      examState.selected = i;
      document.querySelectorAll('.q-opt').forEach(o=>o.classList.remove('selected'));
      el.classList.add('selected');
      document.getElementById('submitBtn').disabled = false;
    };
    optsWrap.appendChild(el);
  });

  document.getElementById('submitBtn').onclick = ()=>{
    if(examState.selected === null || examState.answered) return;
    examState.answered = true;
    const allOpts = document.querySelectorAll('.q-opt');
    allOpts.forEach((o,i)=>{
      if(i === q.ans) o.classList.add('correct');
      else if(i === examState.selected && i !== q.ans) o.classList.add('incorrect');
    });
    if(examState.selected === q.ans) examState.score++;
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = examState.current === examState.pool.length-1 ? t('finish') : t('next');
    submitBtn.disabled = false;
    submitBtn.onclick = ()=>{
      if(examState.current === examState.pool.length-1){
        examState.finished = true;
      } else {
        examState.current++;
        examState.selected = null;
        examState.answered = false;
      }
      renderExamBody();
    };
  };
}

/* ============================================================
   SPLASH / BOOT
   ============================================================ */
document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const lang = btn.getAttribute('data-lang');
    document.getElementById('splash').style.display = 'none';
    setLanguage(lang);
  });
});

document.getElementById('langToggle').addEventListener('click', ()=>{
  setLanguage(LANG === 'en' ? 'ar' : 'en');
});
